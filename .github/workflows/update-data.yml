name: Update Data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install Python dependencies
        run: pip install -r requirements.txt
        
      - name: Run data ingestion script
        run: python scripts/update_data.py
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update FPL and Understat data
          title: 'Update FPL and Understat data'
          body: |
            Updates FPL and Understat data.

            Auto-generated by GitHub Actions.
          branch: auto-update-data
          base: main
